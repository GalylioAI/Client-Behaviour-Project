services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-broker-3
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@192.168.1.105:9093,2@192.168.1.106:9093,3@192.168.1.109:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.109:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: 192.168.1.109
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - monitoring-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=192.168.1.105:9092"
      - "--kafka.server=192.168.1.106:9092"
      - "--kafka.server=192.168.1.109:9092"
      - "--web.listen-address=:9308"
    depends_on:
      - kafka
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - kafka-exporter
      - node-exporter
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: changeme
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro                             # moved out of /var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net

 # ── Airflow ────────────────────────────────────────────────────────────────

  airflow-db:
    image: postgres:15
    container_name: airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - monitoring-net

  airflow:
    image: apache/airflow:2.9.1
    container_name: airflow
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:changeme@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-please"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Connections to external services — reachable over LAN
      AIRFLOW_CONN_CLICKHOUSE_DEFAULT: "http://admin:changeme@192.168.1.106:8123/tracer"
      AIRFLOW_CONN_KAFKA_DEFAULT: "kafka://192.168.1.105:9092,192.168.1.106:9092,192.168.1.109:9092"
      MLOPS_MINIO_ENDPOINT: "http://192.168.1.106:9002"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_S3_ENDPOINT_URL: "http://192.168.1.106:9002"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin123}"

      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-data:/opt/airflow
    depends_on:
      - airflow-db
    networks:
      - monitoring-net
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password changeme --firstname Admin --lastname User --role Admin --email admin@local.com &&
        airflow webserver &
        airflow scheduler
      "

  mlflow-db:
    image: postgres:15
    container_name: mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    networks:
      - monitoring-net

  mlflow:
    build:
      context: ./mlops/mlflow
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: "postgresql://mlflow:changeme@mlflow-db:5432/mlflow"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://mlflow"
      MLFLOW_S3_ENDPOINT_URL: "http://192.168.1.106:9002"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
    depends_on:
      - mlflow-db
    networks:
      - monitoring-net

  mlops-runner:
    build:
      context: ./mlops/runner
    container_name: mlops-runner
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      CLICKHOUSE_URL: "http://admin:changeme@192.168.1.106:8123/tracer"
      MLOPS_MINIO_ENDPOINT: "http://192.168.1.106:9002"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_S3_ENDPOINT_URL: "http://192.168.1.106:9002"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      DVC_REMOTE_URL: "s3://dvc"
      DVC_REMOTE_NAME: "minio"
      PYTHONPATH: "/workspace/mlops/src"
    volumes:
      - ./mlops:/workspace/mlops
      - mlops-workspace:/workspace/runtime
    depends_on:
      - mlflow
    networks:
      - monitoring-net

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
  airflow-db-data:
  airflow-data:
  mlflow-db-data:
  mlops-workspace:

networks:
  monitoring-net:
    driver: bridge

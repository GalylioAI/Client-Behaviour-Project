services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-broker-1
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"  # KRaft controller port
    environment:
      # KRaft mode — no ZooKeeper
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@192.168.1.105:9093,2@192.168.1.106:9093,3@192.168.1.109:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.105:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster ID (must be identical across all 3 nodes)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # Replication & reliability
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Performance tuning for 8GB+ RAM
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net

    # HTTP-to-Kafka bridge (only on PC1)
  bridge:
    build: ./bridge
    container_name: fastapi-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "192.168.1.105:9092,192.168.1.106:9092,192.168.1.109:9092"
      KAFKA_TOPIC: "ecommerce.events"
      DEAD_LETTER_TOPIC: "ecommerce.dead-letter"
      CORS_ALLOW_ORIGINS: "https://tdiscount.tn,https://www.tdiscount.tn"
      CLICKHOUSE_HTTP_URL: "http://admin:changeme@192.168.1.106:8123/?database=tracer"
      SITE_REGISTRY_ENABLED: "true"
      # Strict tenant auth: installed trackers must send a valid write_key.
      SITE_REGISTRY_COMPAT_ALLOW_MISSING_KEY: "true"
      INGEST_AUDIT_ENABLED: "true"
      SITE_REGISTRY_CACHE_TTL_SECONDS: "60"
    depends_on:
      - kafka
    networks:
      - kafka-net

  # Kafka UI — web dashboard for all 3 brokers
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "192.168.1.105:9092,192.168.1.106:9092,192.168.1.109:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "admin"
      SPRING_SECURITY_USER_PASSWORD: "changeme"
    depends_on:
      - kafka
    networks:
      - kafka-net

volumes:
  kafka-data:

networks:
  kafka-net:
    driver: bridge
